apiVersion: apps/v1
kind: Deployment
metadata:
  name: user
  labels:
    app: user
    app.kubernetes.io/part-of: todo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user
  template:
    metadata:
      labels:
        app: user
        version: v1
    spec:
      containers:
      - name: user
        image: quay.io/rh_rh/ocp-todo-user:latest
        imagePullPolicy: Always
        env:
        - name: SERVICE_NAME
          value: user
        envFrom:
        - configMapRef:
            name: todo-config
        ports:
        - name: http
          containerPort: 8080
        livenessProbe:
          httpGet:
            path: /health
            port: http
        readinessProbe:
          httpGet:
            path: /health
            port: http

---
apiVersion: v1
kind: Service
metadata:
  name: user
  labels:
    app: user
spec:
  selector:
    app: user
  ports:
  - name: http
    port: 8080
    targetPort: http