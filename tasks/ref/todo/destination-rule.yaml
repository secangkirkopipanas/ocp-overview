apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: redis
spec:
  host: redis
  subsets:
  - name: v1
    labels:
      version: v1
  trafficPolicy:
    connectionPool:
      tcp:
        connectTimeout: 5s
        maxConnections: 50
    tls:
      mode: ISTIO_MUTUAL

---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: todo
spec:
  host: todo
  subsets:
  - name: v1
    labels:
      version: v1
  trafficPolicy:
    connectionPool:
      http:
        http1MaxPendingRequests: 50
        http2MaxRequests: 100
      tcp:
        maxConnections: 100
    outlierDetection:
      baseEjectionTime: 30s
      consecutive5xxErrors: 5
      interval: 10s
      maxEjectionPercent: 50
    tls:
      mode: ISTIO_MUTUAL

