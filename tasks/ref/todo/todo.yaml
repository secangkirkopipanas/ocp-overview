apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo
  labels:
    app: todo
    app.kubernetes.io/part-of: todo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo
  template:
    metadata:
      labels:
        app: todo
        version: v1
    spec:
      containers:
      - name: todo
        image: quay.io/rh_rh/ocp-todo:latest
        imagePullPolicy: Always
        env:
        - name: SERVICE_NAME
          value: todo
        envFrom:
        - configMapRef:
            name: todo-config
        ports:
        - name: http
          containerPort: 8080
        livenessProbe:
          httpGet:
            path: /health
            port: http
        readinessProbe:
          httpGet:
            path: /health
            port: http

---
apiVersion: v1
kind: Service
metadata:
  name: todo
  labels:
    app: todo
spec:
  selector:
    app: todo
  ports:
  - name: http
    port: 8080
    targetPort: http