# This is a sample deployment for the todo-java application.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  labels:
    app: nginx
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: todo
          image: registry.access.redhat.com/hi/nginx:latest
          imagePullPolicy: Always

          # Resource requests and limits can be set for a container.
          resources:
            requests:
              cpu: 100m
              memory: 250Mi
            limits:
              cpu: 500m
              memory: 768Mi

          # Ports can be exposed from a container.
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

---
# This is a sample service for the todo-java application.
apiVersion: v1
kind: Service
metadata:
  name: nginx-svc
  labels:
    app: nginx
spec:
  selector:
    app: nginx
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP

---
# This is a sample route for the todo-java application.
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: nginx-svc-workshop
spec:
  to:
    kind: Service
    name: nginx-svc
    weight: 100
  port:
    targetPort: 8080
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
