# This is a sample pod definition that runs a utility container.
apiVersion: v1
kind: Pod
metadata:
  name: util
  namespace: istio-system
  labels:
    app: util
spec:
  serviceAccountName: kiali-service-account
  restartPolicy: Never
  containers:
    - name: util
      image: quay.io/rh_rh/utilities:ubi10-latest
      command: ["tail", "-f", "/dev/null"]
      imagePullPolicy: IfNotPresent
      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        capabilities:
          drop: [ "ALL" ]
        seccompProfile:
          type: RuntimeDefault