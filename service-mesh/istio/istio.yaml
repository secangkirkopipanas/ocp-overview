kind: Namespace
apiVersion: v1
metadata:
  name: istio-system
  labels:
    istio-discovery: enabled

---
apiVersion: sailoperator.io/v1
kind: Istio
metadata:
  name: default
spec:
  namespace: istio-system
  values:
    pilot:
      resources:
        requests:
          cpu: 500m
          memory: 1Gi
        limits:
          cpu: 1
          memory: 2Gi
      autoscaleEnabled: true
      autoscaleMin: 1
      autoscaleMax: 3
      
    meshConfig:
      discoverySelectors:
        - matchLabels:
            istio-discovery: enabled
      enableTracing: true
      accessLogFile: /dev/stdout
      defaultConfig:
        proxyMetadata:
          ISTIO_META_DNS_CAPTURE: "true"
          ISTIO_META_DNS_AUTO_ALLOCATE: "true"

    telemetry:
      enabled: true

  updateStrategy:
    type: InPlace
    inactiveRevisionDeletionGracePeriodSeconds: 30

---
# Prometheus must be an explicit mesh metrics provider for Kiali graphs.
apiVersion: telemetry.istio.io/v1
kind: Telemetry
metadata:
  name: enable-prometheus-metrics
  namespace: istio-system
spec:
  metrics:
    - providers:
        - name: prometheus

---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: istiod-podmonitor
  namespace: istio-system
  labels:
    app: istiod
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: default-istiod
  podMetricsEndpoints:
    - port: http-monitoring
      path: /metrics
      interval: 30s

---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: istiod-service-monitor
  namespace: istio-system
spec:
  targetLabels:
  - app
  selector:
    matchLabels:
      istio: pilot
  endpoints:
  - port: http-monitoring
    interval: 30s

---
# OpenShift user-workload monitoring ignores namespaceSelector, so this
# PodMonitor only scrapes istio-proxy pods in THIS namespace. Apply the same
# spec in every mesh namespace (see apps/manifest/base/istio-proxies-monitor.yaml).
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: istio-proxies-monitor
  namespace: istio-system
spec:
  selector:
    matchExpressions:
      - key: istio-prometheus-ignore
        operator: DoesNotExist
  podMetricsEndpoints:
    - path: /stats/prometheus
      interval: 30s
      relabelings:
        - action: keep
          sourceLabels: ["__meta_kubernetes_pod_container_name"]
          regex: "istio-proxy"
        - action: keep
          sourceLabels: ["__meta_kubernetes_pod_annotationpresent_prometheus_io_scrape"]
        - action: replace
          regex: (\d+);(([A-Fa-f0-9]{1,4}::?){1,7}[A-Fa-f0-9]{1,4})
          replacement: "[$2]:$1"
          sourceLabels: ["__meta_kubernetes_pod_annotation_prometheus_io_port", "__meta_kubernetes_pod_ip"]
          targetLabel: "__address__"
        - action: replace
          regex: (\d+);((([0-9]+?)(\.|$)){4})
          replacement: "$2:$1"
          sourceLabels: ["__meta_kubernetes_pod_annotation_prometheus_io_port", "__meta_kubernetes_pod_ip"]
          targetLabel: "__address__"
        - action: replace
          sourceLabels: ["__meta_kubernetes_pod_label_app_kubernetes_io_name", "__meta_kubernetes_pod_label_app"]
          separator: ";"
          regex: "(.+);.*|.*;(.+)"
          replacement: "${1}${2}"
          targetLabel: "app"
        - action: replace
          sourceLabels: ["__meta_kubernetes_pod_label_app_kubernetes_io_version", "__meta_kubernetes_pod_label_version"]
          separator: ";"
          regex: "(.+);.*|.*;(.+)"
          replacement: "${1}${2}"
          targetLabel: "version"
        - action: replace
          sourceLabels: ["__meta_kubernetes_namespace"]
          targetLabel: namespace