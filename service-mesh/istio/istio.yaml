kind: Namespace
apiVersion: v1
metadata:
  name: istio-system
  labels:
    istio-discovery: enabled

---
apiVersion: sailoperator.io/v1
kind: Istio
metadata:
  name: default
spec:
  namespace: istio-system
  values:
    pilot:
      resources:
        requests:
          cpu: 500m
          memory: 1Gi
        limits:
          cpu: 1
          memory: 2Gi
      autoscaleEnabled: true
      autoscaleMin: 1
      autoscaleMax: 3
      
    meshConfig:
      discoverySelectors:
        - matchLabels:
            istio-discovery: enabled
      enableTracing: true
      accessLogFile: /dev/stdout
      defaultConfig:
        proxyMetadata:
          ISTIO_META_DNS_CAPTURE: "true"
          ISTIO_META_DNS_AUTO_ALLOCATE: "true"

    telemetry:
      enabled: true

  updateStrategy:
    type: InPlace
    inactiveRevisionDeletionGracePeriodSeconds: 30

---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: istiod-podmonitor
  namespace: istio-system
  labels:
    app: istiod
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: default-istiod
  podMetricsEndpoints:
    - port: http-monitoring
      path: /metrics
      interval: 30s

---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: istiod-service-monitor
  namespace: istio-system
spec:
  targetLabels:
  - app
  selector:
    matchLabels:
      app: istiod
  endpoints:
  - port: http-monitoring
    interval: 30s

---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: istio-sidecar-podmonitor
  namespace: istio-system
  labels:
    app: istio-sidecar
spec:
  namespaceSelector:
    any: true
  selector:
    matchLabels:
      istio.io/rev: default
  podMetricsEndpoints:
  - port: http-envoy-prom
    path: /stats/prometheus
    interval: 30s