apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: webstore-prod

resources:
- ../../base
- namespace.yaml

images:
- name: quay.io/rh_rh/ocp-webstore-account
  newTag: prod
- name: quay.io/rh_rh/ocp-webstore-products
  newTag: prod
- name: quay.io/rh_rh/ocp-webstore-order
  newTag: prod
- name: quay.io/rh_rh/ocp-webstore-payment
  newTag: prod
- name: quay.io/rh_rh/ocp-webstore-ui
  newTag: prod

replicas:
- name: account
  count: 2
- name: products
  count: 2
- name: products-v2
  count: 1
- name: order
  count: 2
- name: payment
  count: 2
- name: ui
  count: 2

patches:
- target:
    kind: PersistentVolumeClaim
    name: postgres-data
  patch: |-
    - op: replace
      path: /spec/resources/requests/storage
      value: 5Gi
