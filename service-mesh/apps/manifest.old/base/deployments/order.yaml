apiVersion: v1
kind: ServiceAccount
metadata:
  name: order-sa

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: order-sa-waypoint-impersonation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: webstore-waypoint-impersonator
subjects:
- kind: ServiceAccount
  name: order-sa

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order
  template:
    metadata:
      labels:
        app: order
        version: "1.0"
    spec:
      serviceAccountName: order-sa
      containers:
      - name: order
        image: quay.io/rh_rh/ossm3-order:dev
        imagePullPolicy: Always
        env:
        - name: REDIS_HOST
          value: "redis-service"
        ports:
        - containerPort: 6000
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"

---
apiVersion: v1
kind: Service
metadata:
  name: order-service
spec:
  ports:
  - port: 80
    name: http
    targetPort: 6000
  selector:
    app: order

---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: order-service-monitor
  labels:
    openshift.io/user-monitoring: "true"
spec:
  targetLabels:
  - app
  selector:
    matchLabels:
      app: order
  namespaceSelector:
    matchNames:
      - webstore-dev
  endpoints:
  - port: http
    path: /metrics
    interval: 30s

# ---
