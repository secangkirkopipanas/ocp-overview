# Client-side traffic policy. PeerAuthentication is the server-side mTLS policy;
# DestinationRule tells sidecars how to *originate* calls to each host.
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: todo
spec:
  host: todo
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL
    connectionPool:
      tcp:
        maxConnections: 100
      http:
        http1MaxPendingRequests: 50
        http2MaxRequests: 100
    outlierDetection:
      consecutive5xxErrors: 5
      interval: 10s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
  subsets:
  - name: v1
    labels:
      version: v1
---
